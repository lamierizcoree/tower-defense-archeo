<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!-- Arbalète vue de dessus, pointée vers la droite. Le pivot est au centre (32, 32). -->
  <defs>
    <linearGradient id="bois" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c08a52"/>
      <stop offset="0.45" stop-color="#9a6634"/>
      <stop offset="1" stop-color="#6b4220"/>
    </linearGradient>
    <linearGradient id="acier" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2e5f9e"/>
      <stop offset="0.5" stop-color="#5d9be0"/>
      <stop offset="1" stop-color="#2b4f80"/>
    </linearGradient>
    <linearGradient id="fer" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e9edf2"/>
      <stop offset="1" stop-color="#8a939e"/>
    </linearGradient>
    <radialGradient id="laiton" cx="0.35" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#fff0b0"/>
      <stop offset="0.5" stop-color="#d9a640"/>
      <stop offset="1" stop-color="#8a5f18"/>
    </radialGradient>
  </defs>
  <g stroke="#2b1a0e" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round">
    <!-- ombre légère sous l'arme -->
    <ellipse cx="34" cy="35" rx="24" ry="6" fill="#000" fill-opacity="0.18" stroke="none"/>
    <!-- fût en bois, crosse arrondie à gauche -->
    <path d="M8 28.5 Q4 32 8 35.5 L50 35 L52 32 L50 29 Z" fill="url(#bois)"/>
    <path d="M12 30.5 L46 30.3 M14 33.6 L40 33.5" stroke="#5a3519" stroke-width="0.6" fill="none" opacity="0.7"/>
    <!-- cerclages de fer -->
    <rect x="19" y="28" width="3" height="8" rx="0.8" fill="url(#fer)"/>
    <rect x="41" y="28.5" width="3" height="7" rx="0.8" fill="url(#fer)"/>
    <!-- arc en acier bleui, courbé vers l'arrière -->
    <path d="M44 32 C43 22 40 13 34 6 L31.5 7.5 C36.5 14 39.5 22 40.5 32 C39.5 42 36.5 50 31.5 56.5 L34 58 C40 51 43 42 44 32 Z" fill="url(#acier)"/>
    <path d="M42.6 30 C41.8 22 39.4 15 35 9" stroke="#bfe0ff" stroke-width="0.8" fill="none" opacity="0.9"/>
    <!-- embouts de l'arc -->
    <circle cx="33" cy="6.8" r="2" fill="url(#laiton)"/>
    <circle cx="33" cy="57.2" r="2" fill="url(#laiton)"/>
    <!-- corde tendue vers l'arrière -->
    <path d="M33 7.5 L18 32 L33 56.5" stroke="#efe6cf" stroke-width="0.9" fill="none"/>
    <!-- carreau : empennage, hampe, pointe -->
    <path d="M17 32 L54 32" stroke="#3a2412" stroke-width="2.6"/>
    <path d="M17 32 L54 32" stroke="#e3c48e" stroke-width="1.2"/>
    <path d="M16 29.3 L22 31.4 L22 32.6 L16 34.7 Z" fill="#c8402e"/>
    <path d="M53 29.2 L61 32 L53 34.8 Z" fill="url(#fer)"/>
    <!-- pivot en laiton -->
    <circle cx="32" cy="32" r="3.6" fill="url(#laiton)"/>
  </g>
</svg>
