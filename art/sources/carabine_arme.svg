<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!-- Carabine de précision vue de dessus, pointée vers la droite. Pivot au centre (32, 32). -->
  <defs>
    <linearGradient id="bois" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a86d3c"/><stop offset="0.5" stop-color="#7a4a22"/><stop offset="1" stop-color="#4a2c12"/>
    </linearGradient>
    <linearGradient id="fer" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b8c0c8"/><stop offset="0.5" stop-color="#5b626b"/><stop offset="1" stop-color="#2e3338"/>
    </linearGradient>
    <linearGradient id="laiton" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff0b0"/><stop offset="0.5" stop-color="#d9a640"/><stop offset="1" stop-color="#8a5f18"/>
    </linearGradient>
  </defs>
  <g stroke="#1e140b" stroke-width="1.1" stroke-linejoin="round" stroke-linecap="round">
    <ellipse cx="33" cy="35" rx="27" ry="5" fill="#000" fill-opacity="0.2" stroke="none"/>
    <!-- trépied -->
    <path d="M30 32 L22 22 M30 32 L22 42 M30 32 L36 32" stroke="#3a2a1a" stroke-width="2.2"/>
    <!-- crosse -->
    <path d="M4 28 L18 29.5 L22 31 L22 33 L18 34.5 L4 36 Q2 32 4 28 Z" fill="url(#bois)"/>
    <!-- fût en bois -->
    <rect x="20" y="29.5" width="18" height="5" rx="1.5" fill="url(#bois)"/>
    <!-- long canon -->
    <rect x="34" y="30.5" width="27" height="3" rx="1" fill="url(#fer)"/>
    <rect x="58" y="29.8" width="4" height="4.4" rx="1" fill="url(#fer)"/>
    <!-- lunette en laiton -->
    <rect x="22" y="25" width="16" height="4" rx="2" fill="url(#laiton)"/>
    <circle cx="38" cy="27" r="2.4" fill="#9fd3ea"/>
    <path d="M26 29 V30 M34 29 V30" stroke="#5a3d12"/>
    <path d="M24 26 H36" stroke="#fff" stroke-opacity="0.6" stroke-width="0.6"/>
  </g>
</svg>
