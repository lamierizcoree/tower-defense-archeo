    <rect x="47" y="12" width="10" height="8" fill="url(#merlon)"/><rect x="47" y="20" width="10" height="3" fill="#5f5446"/>
    <rect x="7" y="36" width="10" height="8" fill="url(#merlon)"/><rect x="7" y="44" width="10" height="3" fill="#5f5446"/>
