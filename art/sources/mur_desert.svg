<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48">
  <!-- Dessus d'un mur du désert : grès taillé, motif qui se raccorde d'une case à l'autre
       (rangées de 8 px, pierres de 16 px, une rangée sur deux décalée de 8 px). -->
  <defs>
    <linearGradient id="p" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e2c48a"/>
      <stop offset="1" stop-color="#b9935a"/>
    </linearGradient>
    <linearGradient id="q" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d6b47a"/>
      <stop offset="1" stop-color="#a98450"/>
    </linearGradient>
    <linearGradient id="r" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ebd09a"/>
      <stop offset="1" stop-color="#c4a066"/>
    </linearGradient>
  </defs>
  <rect width="48" height="48" fill="#7d5f38"/>
  <g stroke="#5e4428" stroke-width="0.5">
    <!-- rangées paires -->
    <rect x="0.7" y="0.7" width="14.6" height="6.6" rx="1.2" fill="url(#p)"/>
    <rect x="16.7" y="0.7" width="14.6" height="6.6" rx="1.2" fill="url(#q)"/>
    <rect x="32.7" y="0.7" width="14.6" height="6.6" rx="1.2" fill="url(#r)"/>
    <rect x="0.7" y="16.7" width="14.6" height="6.6" rx="1.2" fill="url(#q)"/>
    <rect x="16.7" y="16.7" width="14.6" height="6.6" rx="1.2" fill="url(#r)"/>
    <rect x="32.7" y="16.7" width="14.6" height="6.6" rx="1.2" fill="url(#p)"/>
    <rect x="0.7" y="32.7" width="14.6" height="6.6" rx="1.2" fill="url(#r)"/>
    <rect x="16.7" y="32.7" width="14.6" height="6.6" rx="1.2" fill="url(#p)"/>
    <rect x="32.7" y="32.7" width="14.6" height="6.6" rx="1.2" fill="url(#q)"/>
    <!-- rangées impaires, décalées : les demi-pierres des bords se rejoignent avec la case voisine -->
    <rect x="-7.3" y="8.7" width="14.6" height="6.6" rx="1.2" fill="url(#r)"/>
    <rect x="8.7" y="8.7" width="14.6" height="6.6" rx="1.2" fill="url(#p)"/>
    <rect x="24.7" y="8.7" width="14.6" height="6.6" rx="1.2" fill="url(#q)"/>
    <rect x="40.7" y="8.7" width="14.6" height="6.6" rx="1.2" fill="url(#r)"/>
    <rect x="-7.3" y="24.7" width="14.6" height="6.6" rx="1.2" fill="url(#p)"/>
    <rect x="8.7" y="24.7" width="14.6" height="6.6" rx="1.2" fill="url(#q)"/>
    <rect x="24.7" y="24.7" width="14.6" height="6.6" rx="1.2" fill="url(#r)"/>
    <rect x="40.7" y="24.7" width="14.6" height="6.6" rx="1.2" fill="url(#p)"/>
    <rect x="-7.3" y="40.7" width="14.6" height="6.6" rx="1.2" fill="url(#q)"/>
    <rect x="8.7" y="40.7" width="14.6" height="6.6" rx="1.2" fill="url(#r)"/>
    <rect x="24.7" y="40.7" width="14.6" height="6.6" rx="1.2" fill="url(#p)"/>
    <rect x="40.7" y="40.7" width="14.6" height="6.6" rx="1.2" fill="url(#q)"/>
  </g>
  <!-- arêtes éclairées -->
  <g stroke="#fff2cf" stroke-opacity="0.55" stroke-width="0.7" fill="none">
    <path d="M1.5 1.2 H14.5 M17.5 1.2 H30.5 M33.5 1.2 H46.5 M9.5 9.2 H22.5 M25.5 9.2 H38.5 M41.5 9.2 H48 M0 9.2 H6.5
             M1.5 17.2 H14.5 M17.5 17.2 H30.5 M33.5 17.2 H46.5 M9.5 25.2 H22.5 M25.5 25.2 H38.5 M41.5 25.2 H48 M0 25.2 H6.5
             M1.5 33.2 H14.5 M17.5 33.2 H30.5 M33.5 33.2 H46.5 M9.5 41.2 H22.5 M25.5 41.2 H38.5 M41.5 41.2 H48 M0 41.2 H6.5"/>
  </g>
  <!-- usure : fissures, trous et grains de sable -->
  <g stroke="#7d5f38" stroke-width="0.6" fill="none">
    <path d="M20 2.5 l2 2 l-1 2"/>
    <path d="M36 27 l3 1 l1 2"/>
    <path d="M4 35 l2 2.5"/>
  </g>
  <g fill="#8f6d40">
    <circle cx="10" cy="19" r="0.8"/>
    <circle cx="29" cy="12" r="0.6"/>
    <circle cx="43" cy="44" r="0.9"/>
    <circle cx="14" cy="45" r="0.5"/>
    <circle cx="38" cy="4" r="0.6"/>
  </g>
</svg>
