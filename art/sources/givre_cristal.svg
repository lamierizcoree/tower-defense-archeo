<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!-- Éclats de glace du Givre, vus de trois quarts. Ils flottent au-dessus du socle (centre (32, 40)). -->
  <defs>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#bff0ff" stop-opacity="0.7"/><stop offset="1" stop-color="#bff0ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="clair" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#a6e4f7"/>
    </linearGradient>
    <linearGradient id="sombre" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6cc3e3"/><stop offset="1" stop-color="#2f7fa6"/>
    </linearGradient>
  </defs>
  <circle cx="32" cy="30" r="24" fill="url(#halo)"/>
  <g stroke="#1d5e80" stroke-width="1" stroke-linejoin="round">
    <!-- éclat de gauche -->
    <path d="M20 18 L14 34 L20 42 Z" fill="url(#clair)"/><path d="M20 18 L26 34 L20 42 Z" fill="url(#sombre)"/>
    <!-- éclat de droite -->
    <path d="M45 21 L39 36 L45 43 Z" fill="url(#clair)"/><path d="M45 21 L51 36 L45 43 Z" fill="url(#sombre)"/>
    <!-- grand éclat central -->
    <path d="M32 4 L23 30 L32 46 Z" fill="url(#clair)"/><path d="M32 4 L41 30 L32 46 Z" fill="url(#sombre)"/>
    <path d="M32 6 L32 44" stroke="#fff" stroke-width="0.8" opacity="0.9"/>
    <path d="M27 20 L25.5 27" stroke="#fff" stroke-width="1.2" stroke-linecap="round"/>
  </g>
  <!-- scintillements -->
  <g fill="#fff">
    <path d="M12 16 l1 3 l3 1 l-3 1 l-1 3 l-1 -3 l-3 -1 l3 -1 Z"/>
    <path d="M52 12 l0.8 2.2 l2.2 0.8 l-2.2 0.8 l-0.8 2.2 l-0.8 -2.2 l-2.2 -0.8 l2.2 -0.8 Z"/>
    <circle cx="40" cy="10" r="1"/>
  </g>
</svg>
