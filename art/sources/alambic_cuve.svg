<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!-- Alambic de cuivre posé sur son socle, vu de trois quarts. Centre de la case : (32, 32). -->
  <defs>
    <radialGradient id="cuivre" cx="0.35" cy="0.3" r="0.75">
      <stop offset="0" stop-color="#ffd2a8"/><stop offset="0.35" stop-color="#d9824a"/><stop offset="1" stop-color="#7a3a17"/>
    </radialGradient>
    <linearGradient id="tube" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e59a62"/><stop offset="1" stop-color="#8a4520"/>
    </linearGradient>
    <radialGradient id="poison" cx="0.4" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#d8ff9a"/><stop offset="0.5" stop-color="#7cc43f"/><stop offset="1" stop-color="#2f5e14"/>
    </radialGradient>
    <linearGradient id="laiton" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3d27a"/><stop offset="1" stop-color="#8a5f18"/>
    </linearGradient>
  </defs>
  <g stroke="#3a1c0a" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round">
    <!-- col de cygne vers le condenseur -->
    <path d="M33 14 C38 8 46 8 50 14 L50 22" fill="none" stroke="#3a1c0a" stroke-width="5"/>
    <path d="M33 14 C38 8 46 8 50 14 L50 22" fill="none" stroke="url(#tube)" stroke-width="3"/>
    <rect x="45" y="20" width="10" height="12" rx="2" fill="url(#tube)"/>
    <path d="M45 24 H55 M45 28 H55" stroke="#5a2a10" stroke-width="0.8"/>
    <!-- chapiteau -->
    <path d="M26 20 Q32 9 38 20 Z" fill="url(#cuivre)"/>
    <!-- cuve ventrue -->
    <ellipse cx="32" cy="30" rx="15" ry="13" fill="url(#cuivre)"/>
    <!-- cerclages de laiton -->
    <path d="M17.5 27 Q32 31 46.5 27" fill="none" stroke="url(#laiton)" stroke-width="2.2"/>
    <path d="M18.5 35 Q32 39 45.5 35" fill="none" stroke="url(#laiton)" stroke-width="2.2"/>
    <!-- hublot sur le poison -->
    <circle cx="32" cy="31" r="5.5" fill="#1b2a12"/>
    <circle cx="32" cy="31" r="4.3" fill="url(#poison)" stroke="none"/>
    <circle cx="30.5" cy="29.5" r="1.2" fill="#f4ffd8" stroke="none"/>
    <!-- reflet du cuivre -->
    <path d="M21 24 Q24 19 29 18" fill="none" stroke="#fff2e0" stroke-width="1.4" opacity="0.8"/>
    <!-- petit robinet -->
    <path d="M45 36 l5 2 l0 3" fill="none" stroke="#8a5f18" stroke-width="1.8"/>
  </g>
</svg>
