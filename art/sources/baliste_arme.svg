<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!-- Baliste vue de dessus, pointée vers la droite. Pivot au centre (32, 32). -->
  <defs>
    <linearGradient id="bois" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8a5a32"/><stop offset="0.5" stop-color="#6b4220"/><stop offset="1" stop-color="#43280f"/>
    </linearGradient>
    <linearGradient id="fer" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9aa3ad"/><stop offset="0.5" stop-color="#5b626b"/><stop offset="1" stop-color="#33383f"/>
    </linearGradient>
    <linearGradient id="clair" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2f4f7"/><stop offset="1" stop-color="#8a939e"/>
    </linearGradient>
    <radialGradient id="laiton" cx="0.35" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#fff0b0"/><stop offset="0.5" stop-color="#d9a640"/><stop offset="1" stop-color="#8a5f18"/>
    </radialGradient>
  </defs>
  <g stroke="#1e140b" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round">
    <ellipse cx="33" cy="35" rx="26" ry="7" fill="#000" fill-opacity="0.2" stroke="none"/>
    <!-- treuil à l'arrière avec deux roues -->
    <rect x="6" y="22" width="8" height="20" rx="2" fill="url(#bois)"/>
    <circle cx="10" cy="20" r="4" fill="url(#fer)"/><circle cx="10" cy="44" r="4" fill="url(#fer)"/>
    <path d="M10 16.5 V23.5 M6.5 20 H13.5 M10 40.5 V47.5 M6.5 44 H13.5" stroke="#c9d0d8" stroke-width="0.8"/>
    <!-- double poutre -->
    <rect x="8" y="26.5" width="46" height="4.5" fill="url(#bois)"/>
    <rect x="8" y="33" width="46" height="4.5" fill="url(#bois)"/>
    <path d="M14 28.5 H50 M14 35 H50" stroke="#a8784a" stroke-width="0.6" opacity="0.8"/>
    <!-- cadre de tension et bras en fer -->
    <rect x="36" y="20" width="7" height="24" rx="1.5" fill="url(#bois)"/>
    <path d="M40 22 L30 7 L27 9 L36.5 22 Z" fill="url(#fer)"/>
    <path d="M40 42 L30 57 L27 55 L36.5 42 Z" fill="url(#fer)"/>
    <circle cx="28.5" cy="8" r="2.2" fill="url(#laiton)"/><circle cx="28.5" cy="56" r="2.2" fill="url(#laiton)"/>
    <!-- cordes -->
    <path d="M28.5 8.5 L15 32 L28.5 55.5" stroke="#efe6cf" stroke-width="1.1" fill="none"/>
    <!-- gros carreau à pointe de fer -->
    <path d="M14 32 H54" stroke="#2a1a0c" stroke-width="3.4"/>
    <path d="M14 32 H54" stroke="#d9b47a" stroke-width="1.8"/>
    <path d="M13 28.5 L20 31 L20 33 L13 35.5 Z" fill="#7a2c20"/>
    <path d="M52 27.5 L63 32 L52 36.5 L54 32 Z" fill="url(#clair)"/>
    <!-- rivets -->
    <circle cx="24" cy="28.7" r="1.3" fill="url(#laiton)"/><circle cx="24" cy="35.3" r="1.3" fill="url(#laiton)"/>
    <circle cx="48" cy="28.7" r="1.3" fill="url(#laiton)"/><circle cx="48" cy="35.3" r="1.3" fill="url(#laiton)"/>
    <circle cx="32" cy="32" r="3.2" fill="url(#laiton)"/>
  </g>
</svg>
